<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CNC材料费用计算器</title>
  <meta name="description" content="按材料、形状、尺寸快速估算 CNC 零件材料费用">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CNC材料费用">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --fill: #f2f2f4;
      --fill-strong: #e8e8ed;
      --text: #1d1d1f;
      --text-2: #6e6e73;
      --text-3: #86868b;
      --line: rgba(0, 0, 0, 0.07);
      --blue: #0071e3;
      --blue-press: #0060c0;
      --blue-soft: rgba(0, 113, 227, 0.12);
      --warn-bg: #fff6e6;
      --warn: #9a5b00;
      --dock-bg: rgba(255, 255, 255, 0.86);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 30px rgba(0, 0, 0, 0.07);
      --shadow-raise: 0 1px 3px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --m-steel: #8e8e93;
      --m-stainless: #7b8894;
      --m-al: #6fa0cc;
      --m-cu: #c07a33;
      --m-plastic: #4fa877;
      --m-other: #a1a1a6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --panel: #1c1c1e;
        --fill: #2c2c2e;
        --fill-strong: #3a3a3c;
        --text: #f5f5f7;
        --text-2: #a1a1a6;
        --text-3: #86868b;
        --line: rgba(255, 255, 255, 0.1);
        --blue: #0a84ff;
        --blue-press: #0a6fd8;
        --blue-soft: rgba(10, 132, 255, 0.22);
        --warn-bg: #2b2113;
        --warn: #ffb340;
        --dock-bg: rgba(28, 28, 30, 0.88);
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.55);
        --shadow-raise: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
        --m-steel: #98989d;
        --m-stainless: #8b9aa8;
        --m-al: #8fb8e0;
        --m-cu: #d99a5b;
        --m-plastic: #7cc59a;
        --m-other: #a1a1a6;
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(720px 420px at 6% -10%, rgba(0, 113, 227, 0.10), transparent 62%),
        radial-gradient(560px 360px at 104% -6%, rgba(255, 149, 0, 0.08), transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }

    button, input, summary {
      font: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    button {
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      transition: transform 0.16s var(--ease), background 0.2s var(--ease);
    }

    button:active { transform: scale(0.97); }

    .app {
      max-width: 520px;
      margin: 0 auto;
      /* 给底部固定操作栏留出空间，避免遮住内容 */
      padding: 8px 12px calc(96px + env(safe-area-inset-bottom));
      padding-top: calc(8px + env(safe-area-inset-top));
    }

    /* ---------- 顶栏 ---------- */
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 2px 12px;
    }

    .head h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .copy-btn {
      flex: none;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      background: var(--panel);
      box-shadow: var(--shadow-raise);
    }

    /* ---------- 卡片 ---------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
      padding: 16px;
    }

    .card + .card, .card + .log, .log + .card { margin-top: 12px; }

    .title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .hint {
      margin: 10px 0 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-3);
    }

    /* ---------- 费用汇总 ---------- */
    .sum-label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
    }

    .sum-amount {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-top: 2px;
    }

    .sum-amount strong {
      font-size: clamp(34px, 11vw, 44px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .sum-amount i {
      font-style: normal;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-2);
    }

    .sum-sub {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--text-3);
      overflow-wrap: anywhere;
    }

    .sum-sub b { font-weight: 600; color: var(--text-2); }

    .sum-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .stat {
      min-width: 0;
      padding: 8px 5px;
      border-radius: 12px;
      background: var(--fill);
      text-align: center;
    }

    .stat > span {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat > b {
      display: block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    /* ---------- 材料胶囊 ---------- */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* flex-grow 让每行的胶囊自动撑满整行，任何屏宽都不会留下空档 */
    .chip {
      flex: 1 1 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      /* 手机上的主要输入方式，按 44px 触控标准给足高度 */
      min-height: 44px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--fill);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
    }

    .chip.active {
      background: var(--blue);
      color: #fff;
      font-weight: 600;
    }

    .dot {
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.16);
    }

    .chip.active .dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7); }

    .dot-steel { background: var(--m-steel); }
    .dot-stainless { background: var(--m-stainless); }
    .dot-al { background: var(--m-al); }
    .dot-cu { background: var(--m-cu); }
    .dot-plastic { background: var(--m-plastic); }
    .dot-other { background: var(--m-other); }

    /* ---------- 输入 ---------- */
    .form-grid, .dim-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      min-width: 0;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
    }

    .span-2 { grid-column: 1 / -1; }

    input {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      color: var(--text);
      background: var(--fill);
      border: 1px solid transparent;
      border-radius: 14px;
      /* 16px 以下 iOS 聚焦时会自动放大页面，这里固定 16px */
      font-size: 16px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: background 0.22s var(--ease), box-shadow 0.22s var(--ease), border-color 0.22s var(--ease);
    }

    input::placeholder { color: var(--text-3); }

    input:focus {
      background: var(--panel);
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-soft);
    }

    /* ---------- 形状 ---------- */
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      border-radius: 16px;
      background: var(--fill);
    }

    .segmented .shape {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 46px;
      padding: 0 4px;
      border-radius: 12px;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
    }

    .segmented .shape.active {
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--shadow-raise);
    }

    .ico {
      flex: none;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sum-sub .ico {
      width: 15px;
      height: 15px;
      stroke-width: 1.6;
    }

    /* ---------- 高级 ---------- */
    details.card { padding: 0; }

    details.card > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
      list-style: none;
      outline: none;
    }

    details.card > summary::-webkit-details-marker { display: none; }

    details.card > summary::before {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-45deg) translate(-1px, -1px);
      transition: transform 0.24s var(--ease);
    }

    details.card[open] > summary::before { transform: rotate(45deg) translate(-2px, -2px); }

    details.card .form-grid { padding: 0 16px 16px; }

    /* ---------- 提示 ---------- */
    .log { font-size: 13px; line-height: 1.5; color: var(--text-2); }

    .log:not(:empty) {
      padding: 11px 14px;
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 14px;
    }

    /* ---------- 底部固定操作栏 ---------- */
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
      background: var(--dock-bg);
      border-top: 1px solid var(--line);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
    }

    .dock-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto;
    }

    .dock-cost {
      flex: 1 1 auto;
      min-width: 0;
    }

    .dock-cost > span {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
    }

    .dock-cost > div {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .dock-cost strong {
      font-size: clamp(18px, 6vw, 23px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .dock-cost i {
      font-style: normal;
      font-size: 12.5px;
      color: var(--text-2);
    }

    .btn-calc {
      flex: none;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 14px;
      color: #fff;
      background: var(--blue);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .btn-calc:active { background: var(--blue-press); }

    .btn-clear {
      flex: none;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      color: var(--text);
      background: var(--fill-strong);
      font-weight: 500;
    }

    /* ---------- 复制兜底面板 ---------- */
    .copy-layer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .copy-panel {
      width: 100%;
      max-width: 380px;
      padding: 16px;
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow-card);
    }

    .copy-panel p {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--text-2);
    }

    .copy-panel textarea {
      width: 100%;
      height: 132px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--fill);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
    }

    .copy-panel button {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      border-radius: 14px;
      background: var(--blue);
      color: #fff;
      font-weight: 600;
    }

    /* ---------- 费用卡右上角：加工承接（广告位） ---------- */
    .sum-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .sum-main { flex: 1 1 auto; min-width: 0; }

    .ad-card {
      flex: 0 0 auto;
      width: 47%;
      max-width: 178px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
    }

    .ad-brand {
      margin: 0;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .ad-line {
      margin: 4px 0 0;
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--text-2);
    }

    .ad-copy {
      display: block;
      width: 100%;
      min-height: 38px;
      margin-top: 7px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .card { animation: rise 0.45s var(--ease) both; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* 窄屏（iPhone SE 等 320px）再收紧一档 */
    @media (max-width: 350px) {
      .app { padding-left: 10px; padding-right: 10px; }
      .card { padding: 14px; border-radius: 18px; }
      .chip { padding: 0 9px; gap: 5px; font-size: 12.5px; }
      .sum-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      /* 320px 放不下左右并排：广告移到价格下方，仍留在同一张卡里 */
      .sum-top { flex-wrap: wrap; }
      .ad-card {
        width: 100%;
        max-width: none;
        padding-left: 0;
        padding-top: 10px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .stat > span { font-size: 11px; }
      .stat > b { font-size: 15px; }
      .btn-calc { padding: 0 18px; }
      .btn-clear { padding: 0 13px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="head">
      <h1>CNC材料费用计算器</h1>
      <button class="copy-btn" id="copyBtn" type="button">分享结果</button>
    </header>

    <section class="card summary" aria-label="费用汇总">
      <div class="sum-top">
        <div class="sum-main">
          <span class="sum-label">材料费用</span>
          <div class="sum-amount">
            <strong data-result="cost">0.00</strong>
            <i>元</i>
          </div>
          <p class="sum-sub">
            <span data-result="materialShow">未选择</span>
            <span>·</span>
            <svg class="ico" id="heroShapeIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"></svg>
            <span data-result="shapeShow">圆棒</span>
            <span>·</span>
            <span>单价 <b data-result="priceShow">0</b> 元/kg</span>
          </p>
        </div>

        <!-- 加工承接广告位：改文案只动这一段 -->
        <aside class="ad-card" aria-label="加工承接">
          <p class="ad-brand">数控小煲 · CNC车床加工</p>
          <p class="ad-line">不锈钢 · 钛合金 · 铜 · POM</p>
          <button class="ad-copy" id="adCopy" type="button" title="点击复制微信号">微信 xtxb0263</button>
        </aside>
      </div>
      <div class="sum-grid">
        <div class="stat"><span>单件重量 kg</span><b data-result="oneWeight">0</b></div>
        <div class="stat"><span>总重量 kg</span><b data-result="totalWeight">0</b></div>
        <div class="stat"><span>体积 cm³</span><b data-result="volume">0</b></div>
        <div class="stat"><span>密度 g/cm³</span><b data-result="densityShow">0</b></div>
      </div>
    </section>

    <section class="card">
      <p class="title">常用材料</p>
      <div class="chips" id="materialChips"></div>
    </section>

    <section class="card">
      <div class="form-grid">
        <label class="span-2">材料
          <input id="material" list="materialList" placeholder="点上面的常用材料，或输入牌号" autocomplete="off" autocorrect="off" spellcheck="false">
        </label>
        <label>单价 元/kg
          <input id="price" inputmode="decimal" placeholder="例如 10">
        </label>
        <label>数量
          <input id="qty" inputmode="decimal" value="1">
        </label>
      </div>
      <p class="hint">材料和单价填过一次就会记住：下次输入 POM，单价自动带出。</p>
      <datalist id="materialList"></datalist>
    </section>

    <section class="card">
      <p class="title">形状</p>
      <div class="segmented" id="shapeGrid"></div>
    </section>

    <section class="card">
      <p class="title" id="dimTitle">尺寸</p>
      <div class="dim-grid" id="dimFields"></div>
    </section>

    <details class="card">
      <summary>高级：损耗、余量、密度</summary>
      <div class="form-grid">
        <label>损耗 %<input id="loss" inputmode="decimal" value="0"></label>
        <label>尺寸余量 mm<input id="allowance" inputmode="decimal" value="0"></label>
        <label class="span-2">密度 g/cm³<input id="density" inputmode="decimal" placeholder="自动带出"></label>
      </div>
    </details>

    <div class="log" id="log"></div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <div class="dock-cost">
        <span>材料费用</span>
        <div>
          <strong data-result="cost">0.00</strong>
          <i>元</i>
        </div>
      </div>
      <button class="btn-calc" id="calcBtn" type="button">计算</button>
      <button class="btn-clear" id="clearBtn" type="button">清空</button>
    </div>
  </div>
  <script>
    const materials = [
      { name: "45#钢/Q235/A3", keys: ["45#", "45号钢", "45钢", "Q235", "A3"], density: 7.85, hot: true },
      { name: "20#钢", keys: ["20#", "20号钢"], density: 7.85, hot: true },
      { name: "65Mn弹簧钢", keys: ["65MN", "65Mn"], density: 7.85, hot: true },
      { name: "T10工具钢", keys: ["T10", "工具钢T10"], density: 7.85, hot: true },
      { name: "40Cr合金钢", keys: ["40CR", "40Cr"], density: 7.85, hot: true },
      { name: "42CrMo合金钢", keys: ["42CRMO", "42CrMo"], density: 7.85, hot: true },
      { name: "38CrMoAl合金钢", keys: ["38CRMOAL", "38CrMoAl"], density: 7.85, hot: true },
      { name: "20CrMnTi合金钢", keys: ["20CRMNTI", "20CrMnTi"], density: 7.85, hot: true },
      { name: "GCr15轴承钢", keys: ["GCR15", "GCr15"], density: 7.81, hot: true },

        if (/^[A-Z0-9.-]+$/.test(key) && key.length <= 3) {
          const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          return new RegExp(`(^|[^A-Z0-9])${escaped}($|[^A-Z0-9])`).test(raw);
        }
        return raw.includes(key);
      };
      const matched = materials
        .map(item => {
          const terms = [...item.keys, item.name];
          const best = terms
            .map(term => term.toUpperCase())
            .filter(term => hasTerm(term))
            .sort((a, b) => b.length - a.length)[0];
          return best ? { item, length: best.length } : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.length - a.length);

      if (fromShape === "round" && toShape === "tube") {

      if (fromShape === "tube" && toShape === "round") {

      if (fromShape === "hex" && toShape === "round") {

      if (state.shape === "round") return Math.PI * Math.pow(v("diameter"), 2) / 4 * v("length");
      if (state.shape === "tube") {
        const outer = v("outer");
        const inner = raw("inner");

        return Math.PI * (Math.pow(outer, 2) - Math.pow(inner, 2)) / 4 * v("length");

      if (state.shape === "plate") return v("length") * v("width") * v("height");
      if (state.shape === "squareTube") {
        const width = v("width");
        const height = v("height");
        const wall = raw("wall");
        const innerWidth = Math.max(0, width - wall * 2);
        const innerHeight = Math.max(0, height - wall * 2);
        return (width * height - innerWidth * innerHeight) * v("length");
      }
      if (state.shape === "hex") return Math.sqrt(3) / 2 * Math.pow(v("across"), 2) * v("length");
      if (state.shape === "ibeam") {

        const flange = v("flange");

        const flangeThickness = raw("flangeThickness");

    const upgradable = location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname);
    if (upgradable) {
      const exists = (url) => fetch(url, { method: "HEAD" }).then((res) => res.ok).catch(() => false);
      const attach = (tag, attrs) => {
        const node = document.createElement(tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        document.head.appendChild(node);
      };
      exists("./manifest.json").then((ok) => { if (ok) attach("link", { rel: "manifest", href: "./manifest.json" }); });
      exists("./icon-180.png").then((ok) => { if (ok) attach("link", { rel: "apple-touch-icon", sizes: "180x180", href: "./icon-180.png" }); });
      if ("serviceWorker" in navigator) {
        exists("./sw.js").then((ok) => { if (ok) navigator.serviceWorker.register("./sw.js").catch(() => {}); });
      }
    }
  })();
</script>
<script>
  // 广告位微信号一键复制：优先剪贴板接口，老浏览器/微信内置浏览器回退 execCommand
  (function () {
    const btn = document.getElementById("adCopy");
    if (!btn) return;
    const wechat = "xtxb0263";
    const label = btn.textContent;

    function legacyCopy(text) {
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0.01;";
      document.body.appendChild(area);
      let ok = false;
      try {
        area.focus({ preventScroll: true });
        area.select();
        area.setSelectionRange(0, area.value.length);
        ok = document.execCommand("copy");
      } catch (error) { ok = false; }
      document.body.removeChild(area);
      return ok;
    }

    function copy(text) {
      if (!(navigator.clipboard && window.isSecureContext)) {
        return Promise.resolve(legacyCopy(text));
      }
      // 个别环境（本地 file:// 打开时）writeText 既不 resolve 也不 reject，加超时兜底，保证按钮一定有反馈
      let settled = false;
      return new Promise((resolve) => {
        const finish = (ok) => { if (!settled) { settled = true; resolve(ok); } };
        navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => finish(legacyCopy(text)));
        setTimeout(() => finish(legacyCopy(text)), 900);
      });
    }

    btn.addEventListener("click", () => {
      copy(wechat).then((ok) => {
        btn.textContent = ok ? "已复制" : wechat;
        setTimeout(() => { btn.textContent = label; }, 1600);
      });
    });
  })();
</script>
