<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CNC材料费用计算器</title>
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CNC材料费用">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --panel-soft: #fafafa;
      --fill: #f2f2f4;
      --fill-strong: #e8e8ed;
      --text: #1d1d1f;
      --text-2: #6e6e73;
      --text-3: #86868b;
      --line: rgba(0, 0, 0, 0.07);
      --line-strong: rgba(0, 0, 0, 0.12);
      --blue: #0071e3;
      --blue-press: #0060c0;
      --blue-soft: rgba(0, 113, 227, 0.12);
      --warn-bg: #fff6e6;
      --warn: #9a5b00;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 30px rgba(0, 0, 0, 0.07);
      --shadow-raise: 0 1px 3px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --m-steel: #8e8e93;
      --m-stainless: #7b8894;
      --m-al: #6fa0cc;
      --m-cu: #c07a33;
      --m-plastic: #4fa877;
      --m-other: #a1a1a6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --panel: #1c1c1e;
        --panel-soft: #2c2c2e;
        --fill: #2c2c2e;
        --fill-strong: #3a3a3c;
        --text: #f5f5f7;
        --text-2: #a1a1a6;
        --text-3: #86868b;
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.18);
        --blue: #0a84ff;
        --blue-press: #0a6fd8;
        --blue-soft: rgba(10, 132, 255, 0.22);
        --warn-bg: #2b2113;
        --warn: #ffb340;
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.55);
        --shadow-raise: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
        --m-steel: #98989d;
        --m-stainless: #8b9aa8;
        --m-al: #8fb8e0;
        --m-cu: #d99a5b;
        --m-plastic: #7cc59a;
        --m-other: #a1a1a6;
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(1100px 560px at 8% -12%, rgba(0, 113, 227, 0.10), transparent 62%),
        radial-gradient(820px 480px at 102% -4%, rgba(255, 149, 0, 0.07), transparent 58%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 1020px;
      margin: 0 auto;
      padding: 20px 18px 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    /* ---------- 顶部 ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 4px 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4.4vw, 38px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      color: var(--text-2);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.18);
    }

    /* ---------- 布局 ---------- */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: 22px;
      animation: rise 0.55s var(--ease) both;
    }

    .title {
      margin: 0 0 12px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .title + .title,
    .section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .muted {
      color: var(--text-3);
      font-size: 13px;
      line-height: 1.5;
      margin: 10px 0 0;
    }

    /* ---------- 表单 ---------- */
    textarea, input, button, summary {
      font: inherit;
      letter-spacing: inherit;
    }

    input, textarea {
      width: 100%;
      color: var(--text);
      background: var(--fill);
      border: 1px solid transparent;
      border-radius: var(--radius);
      outline: none;
      transition: background 0.22s var(--ease), box-shadow 0.22s var(--ease), border-color 0.22s var(--ease);
      -webkit-appearance: none;
      appearance: none;
    }

    input {
      min-height: 48px;
      padding: 11px 15px;
    }

    input::placeholder { color: var(--text-3); }

    input:focus, textarea:focus {
      background: var(--panel);
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-soft);
    }

    button {
      border: 0;
      min-height: 48px;
      border-radius: var(--radius);
      padding: 0 20px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      background: var(--fill-strong);
      transition: transform 0.16s var(--ease), background 0.2s var(--ease), opacity 0.2s var(--ease);
      -webkit-user-select: none;
      user-select: none;
    }

    button:active { transform: scale(0.97); }

    .primary {
      background: var(--blue);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .primary:hover { background: var(--blue-press); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .dim-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
    }

    /* ---------- 分段控件（形状） ---------- */
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
      background: var(--fill);
      border-radius: var(--radius);
      padding: 3px;
    }

    .segmented .shape {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 8px;
      border-radius: 11px;
      background: transparent;
      color: var(--text-2);
      font-size: 14px;
      font-weight: 500;
    }

    .segmented .shape:hover { color: var(--text); }

    .segmented .shape:active { transform: none; }

    .segmented .shape.active {
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--shadow-raise);
    }

    /* ---------- 材料胶囊 ---------- */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 14px 0 12px;
      border-radius: 999px;
      background: var(--fill);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
    }

    .chip:hover { background: var(--fill-strong); }

    .chip.active {
      background: var(--blue);
      color: #fff;
      font-weight: 600;
    }

    .chip.active:hover { background: var(--blue); }

    /* ---------- 图标 ---------- */
    .ico {
      flex: none;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-sub .ico {
      width: 15px;
      height: 15px;
      vertical-align: -2px;
      margin-right: 5px;
    }

    .dot {
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.16);
    }

    .chip.active .dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7); }

    .dot-steel { background: var(--m-steel); }
    .dot-stainless { background: var(--m-stainless); }
    .dot-al { background: var(--m-al); }
    .dot-cu { background: var(--m-cu); }
    .dot-plastic { background: var(--m-plastic); }
    .dot-other { background: var(--m-other); }

    /* ---------- 高级 ---------- */
    details {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    summary {
      cursor: pointer;
      color: var(--text-2);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    summary::-webkit-details-marker { display: none; }

    summary::before {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-45deg) translate(-1px, -1px);
      transition: transform 0.24s var(--ease);
    }

    details[open] summary::before { transform: rotate(45deg) translate(-2px, -2px); }

    details .form-grid { margin-top: 14px; }

    /* ---------- 结果卡 ---------- */
    .result-hero {
      position: sticky;
      top: 20px;
      align-self: start;
      display: grid;
      gap: 18px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-card);
      animation: rise 0.55s var(--ease) 0.06s both;
    }

    .hero-label {
      display: block;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .hero-amount {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .hero-amount strong {
      font-size: clamp(42px, 5vw, 54px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .hero-amount i {
      font-style: normal;
      color: var(--text-2);
      font-size: 16px;
      font-weight: 500;
    }

    .hero-sub {
      margin: 8px 0 0;
      color: var(--text-3);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .stat {
      display: block;
      background: var(--fill);
      border-radius: var(--radius);
      padding: 11px 13px;
      min-width: 0;
    }

    .stat > span {
      display: block;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .stat > b {
      display: block;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .stat input {
      min-height: 26px;
      height: 26px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .stat input:focus {
      background: transparent;
      box-shadow: none;
      border-color: transparent;
    }

    .hero-side {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .hero-detail {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    /* ---------- 操作 & 提示 ---------- */
    .actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .log {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-2);
    }

    .log:not(:empty) {
      padding: 11px 14px;
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: var(--radius);
    }

    /* ---------- 费用卡右上角：加工承接（广告位） ---------- */
    .sum-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .sum-main { flex: 1 1 auto; min-width: 0; }

    .ad-card {
      flex: 0 0 auto;
      width: 46%;
      max-width: 172px;
      padding-left: 14px;
      border-left: 1px solid var(--line);
    }

    .ad-brand {
      margin: 0;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .ad-line {
      margin: 4px 0 0;
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--text-2);
    }

    /* 机床出售是另一门生意，单独一行并加重，避免被当成加工说明 */
    .ad-line-strong {
      color: var(--text);
      font-weight: 600;
    }

    .ad-copy {
      display: block;
      width: 100%;
      min-height: 34px;
      margin-top: 7px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ad-copy:hover { background: rgba(0, 113, 227, 0.2); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* ---------- 移动端 ---------- */
    @media (max-width: 860px) {
      .app { padding: 14px 12px 28px; padding-top: calc(14px + env(safe-area-inset-top)); }

      .topbar { padding: 2px 4px 16px; }

      h1 { font-size: 25px; }

      .layout { grid-template-columns: 1fr; gap: 12px; }

      .panel { padding: 18px; border-radius: 22px; }

      .result-hero {
        order: -1;
        top: calc(8px + env(safe-area-inset-top));
        z-index: 20;
        gap: 14px;
        padding: 18px;
        border-radius: 22px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06), 0 16px 40px rgba(0, 0, 0, 0.14);
      }

      .hero-amount strong { font-size: 38px; }

      .form-grid, .dim-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

      input, button { min-height: 50px; }
    }

    @media (max-width: 460px) {
      .badge { display: none; }

      .segmented { grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .segmented .shape { min-height: 44px; padding: 0 4px; gap: 5px; font-size: 13px; }

      .segmented .shape .ico { width: 15px; height: 15px; stroke-width: 1.7; }

      .form-grid, .dim-grid { grid-template-columns: 1fr; }

      /* 手机端收窄结果卡：数值与单位分离后，四项明细并成一排 */
      .result-hero { gap: 12px; padding: 16px; }

      .hero-amount strong { font-size: 34px; }

      .hero-detail {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        padding-top: 14px;
      }

      .hero-detail .stat {
        padding: 8px 6px;
        text-align: center;
      }

      .hero-detail .stat > span {
        font-size: 10px;
        margin-bottom: 2px;
      }

      .hero-detail .stat > b { font-size: 13px; }

      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>CNC材料费用计算器</h1>
      <div class="badge">离线可用</div>
    </div>

    <div class="layout">
      <section class="panel">
        <p class="title">常用材料</p>
        <div class="chips" id="materialChips"></div>

        <div class="section">
          <div class="form-grid">
            <label>
              材料
              <input id="material" list="materialList" placeholder="输入或点上面的材料" autocomplete="off">
              <datalist id="materialList"></datalist>
            </label>
            <label>
              单价 元/kg
              <input id="price" inputmode="decimal" placeholder="例如 10">
            </label>
          </div>
          <p class="muted">填过材料和单价后会自动记住，例如 POM 填 25，下次输入 POM 会自动带出 25。</p>
        </div>

        <div class="section">
          <p class="title">形状</p>
          <div class="segmented" id="shapeGrid"></div>
        </div>

        <div class="section">
          <p class="title" id="dimTitle">尺寸</p>
          <div class="dim-grid" id="dimFields"></div>
        </div>

        <details>
          <summary>高级：损耗、余量、密度</summary>
          <div class="form-grid">
            <label>损耗 %<input id="loss" inputmode="decimal" value="0"></label>
            <label>尺寸余量 mm<input id="allowance" inputmode="decimal" value="0"></label>
            <label>密度 g/cm³<input id="density" inputmode="decimal" placeholder="自动带出"></label>
          </div>
        </details>

        <div class="actions">
          <button class="primary" id="calcBtn">计算</button>
          <button id="clearBtn">清空</button>
        </div>
        <div class="log" id="log"></div>
      </section>

      <section class="result-hero" aria-label="价格栏">
        <div class="sum-top">
          <div class="sum-main">
            <span class="hero-label">材料费用</span>
            <div class="hero-amount">
              <strong data-result="cost">0.00</strong>
              <i>元</i>
            </div>
            <p class="hero-sub"><span data-result="materialShow">未选择</span> · <svg class="ico" id="heroShapeIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"></svg><span data-result="shapeShow">圆棒</span></p>
          </div>

          <!-- 加工承接广告位：改文案只动这一段 -->
          <aside class="ad-card" aria-label="加工承接">
            <p class="ad-brand">数控小煲</p>
            <p class="ad-line">CNC车床加工</p>
            <p class="ad-line">不锈钢·钛合金·铜·POM</p>
            <p class="ad-line ad-line-strong">CNC车床出售</p>
            <button class="ad-copy" id="adCopy" type="button" title="点击复制微信号">微信 xtxb0263</button>
          </aside>
        </div>

        <div class="hero-side">
          <div class="stat">
            <span>单价 元/kg</span>
            <b data-result="priceShow">0</b>
          </div>
          <label class="stat">
            <span>数量</span>
            <input id="qty" inputmode="decimal" value="1">
          </label>
        </div>

        <div class="hero-detail">
          <div class="stat">
            <span>单件重量 kg</span>
            <b data-result="oneWeight">0</b>
          </div>
          <div class="stat">
            <span>总重量 kg</span>
            <b data-result="totalWeight">0</b>
          </div>
          <div class="stat">
            <span>体积 cm³</span>
            <b data-result="volume">0</b>
          </div>
          <div class="stat">
            <span>密度 g/cm³</span>
            <b data-result="densityShow">0</b>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const materials = [
      { name: "45#钢/Q235/A3", keys: ["45#", "45号钢", "45钢", "Q235", "A3"], density: 7.85, hot: true },
      { name: "20#钢", keys: ["20#", "20号钢"], density: 7.85, hot: true },
      { name: "65Mn弹簧钢", keys: ["65MN", "65Mn"], density: 7.85, hot: true },
      { name: "T10工具钢", keys: ["T10", "工具钢T10"], density: 7.85, hot: true },
      { name: "40Cr合金钢", keys: ["40CR", "40Cr"], density: 7.85, hot: true },
      { name: "42CrMo合金钢", keys: ["42CRMO", "42CrMo"], density: 7.85, hot: true },
      { name: "38CrMoAl合金钢", keys: ["38CRMOAL", "38CrMoAl"], density: 7.85, hot: true },
      { name: "20CrMnTi合金钢", keys: ["20CRMNTI", "20CrMnTi"], density: 7.85, hot: true },
      { name: "GCr15轴承钢", keys: ["GCR15", "GCr15"], density: 7.81, hot: true },
      { name: "SUS303不锈钢", keys: ["SUS303", "303"], density: 7.93, hot: true },

      { name: "钛合金TA2", keys: ["TA2", "钛合金TA2"], density: 4.51 },
      { name: "镁合金AZ31", keys: ["AZ31", "镁合金AZ31"], density: 1.78 },
      { name: "镁合金AZ91D", keys: ["AZ91D", "镁合金AZ91D"], density: 1.81 },
      { name: "H59黄铜", keys: ["H59", "黄铜59"], density: 8.50 },
      { name: "工业镍", keys: ["工业镍", "镍"], density: 8.90 },

      { name: "其他材料", keys: ["其他材料", "其他"], density: 0 }
    ];

    const shapes = {
      round: { label: "圆棒", aliases: ["圆棒", "棒料", "圆钢"], fields: [["diameter", "直径 mm"], ["length", "长度 mm"]] },
      tube: { label: "圆管", aliases: ["管料", "圆管", "钢管"], fields: [["outer", "外径 mm"], ["inner", "内径 mm"], ["length", "长度 mm"]] },
      plate: { label: "板/方料", aliases: ["板料", "方料", "铝板", "钢板", "块料"], fields: [["length", "长度 mm"], ["width", "宽度 mm"], ["height", "厚度/高度 mm"]] },
      squareTube: { label: "方管", aliases: ["方管", "矩形管", "方通"], fields: [["width", "外宽 mm"], ["height", "外高 mm"], ["wall", "壁厚 mm"], ["length", "长度 mm"]] },
      hex: { label: "六方", aliases: ["六方", "六角", "六角棒", "六方棒"], fields: [["across", "对边 mm"], ["length", "长度 mm"]] },
      ibeam: { label: "工字钢", aliases: ["工字钢", "工字梁", "I型钢"], fields: [["height", "高度H mm"], ["flange", "翼宽B mm"], ["web", "腹板厚tw mm"], ["flangeThickness", "翼板厚tf mm"], ["length", "长度 mm"]] }
    };

    // 各形状的截面线框图标（24x24，随文字颜色变化）
    const shapeIcons = {
      round: '<circle cx="12" cy="12" r="7.6"/>',
      tube: '<ellipse cx="12" cy="6.5" rx="6.4" ry="2.8"/><path d="M5.6 6.5v10.6a6.4 2.8 0 0 0 12.8 0V6.5"/>',
      plate: '<rect x="2.6" y="8" width="18.8" height="8" rx="1.6"/>',
      squareTube: '<rect x="4" y="4" width="16" height="16" rx="1.8"/><rect x="8.6" y="8.6" width="6.8" height="6.8" rx="1"/>',
      hex: '<path d="M12 3.7l7.2 4.15v8.3L12 20.3 4.8 16.15v-8.3z"/>',
      ibeam: '<path d="M4 3.6h16V7h-6.8v10H20v3.4H4V17h6.8V7H4z"/>'
    };

    // 材料族，用于胶囊上的小色点
    const materialFamilies = [
      ["stainless", /不锈钢|SUS|Cr18Ni9/i],
      ["cu", /铜|H59|H62|^T2$/],
      ["al", /铝|AL\d|ADC|2A1\d|5A0\d|LY12/],
      ["plastic", /POM|PA\d|尼龙|电木|亚克力|铁氟龙|聚四氟|PEEK|赛钢|PF$/i],
      ["steel", /钢|铁|Cr|Mo|Mn|Ni|钨/],
      ["other", /./]
    ];

    const $ = (id) => document.getElementById(id);
    const state = { shape: "round" };
    const commonMaterialNames = [
      "45#钢/Q235/A3",
      "304不锈钢",
      "316不锈钢",
      "6061铝",
      "7075铝",
      "H62黄铜",
      "T2紫铜",
      "POM",
      "20#钢",
      "2A12铝",
      "PA66尼龙"
    ];
    let lastMaterialName = "";

    function setResult(id, value) {
      document.querySelectorAll(`[data-result="${id}"]`).forEach(item => {
        item.textContent = value;
      });
    }

    function numberOf(value) {
      const num = parseFloat(String(value || "").replace(",", "."));
      return Number.isFinite(num) ? num : 0;
    }

    function money(value) {
      return Number(value || 0).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fixed(value, digits = 3) {
      if (!Number.isFinite(value)) return "0";
      return Number(value).toFixed(digits).replace(/\.?0+$/, "");
    }

    function getSavedPrices() {
      try { return JSON.parse(localStorage.getItem("cncMaterialPrices") || "{}"); }
      catch { return {}; }
    }

    function setSavedPrices(data) {
      localStorage.setItem("cncMaterialPrices", JSON.stringify(data));
    }

    function savedPriceForMaterial(material) {
      if (!material) return null;
      const saved = getSavedPrices();
      const names = [material.name, ...material.keys];
      for (const name of names) {
        if (saved[name]?.manual && saved[name]?.price) return saved[name];
      }
      return null;
    }

    function savedPriceForName(name) {
      const saved = getSavedPrices();
      return saved[name]?.manual && saved[name]?.price ? saved[name] : null;
    }

    function findMaterial(text) {
      const raw = String(text || "").toUpperCase();
      const hasTerm = (term) => {
        const key = term.toUpperCase();
        if (/^[A-Z0-9.-]+$/.test(key) && key.length <= 3) {
          const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          return new RegExp(`(^|[^A-Z0-9])${escaped}($|[^A-Z0-9])`).test(raw);
        }
        return raw.includes(key);
      };
      const matched = materials
        .map(item => {
          const terms = [...item.keys, item.name];
          const best = terms
            .map(term => term.toUpperCase())
            .filter(term => hasTerm(term))
            .sort((a, b) => b.length - a.length)[0];
          return best ? { item, length: best.length } : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.length - a.length);
      return matched[0]?.item;
    }

    function materialFamily(name) {
      const hit = materialFamilies.find(([, pattern]) => pattern.test(name));
      return hit ? hit[0] : "other";
    }

    function shapeIcon(key) {
      return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${shapeIcons[key] || ""}</svg>`;
    }

    function renderMaterialList() {
      $("materialList").innerHTML = materials.map(item => `<option value="${item.name}"></option>`).join("");
    }

    function renderMaterialChips() {
      $("materialChips").innerHTML = commonMaterialNames
        .map(name => materials.find(item => item.name === name))
        .filter(Boolean)
        .map(item => (
        `<button class="chip" data-material="${item.name}"><i class="dot dot-${materialFamily(item.name)}"></i>${item.name}</button>`
      )).join("");
      const current = currentMaterialName();
      document.querySelectorAll("[data-material]").forEach(btn => {
        btn.addEventListener("click", () => {
          setMaterial(btn.dataset.material);
          renderMaterialChips();
          calculate();
        });
        btn.classList.toggle("active", btn.dataset.material === current);
      });
    }

    function renderShapeGrid() {
      $("shapeGrid").innerHTML = Object.entries(shapes).map(([key, shape]) => (
        `<button class="shape ${key === state.shape ? "active" : ""}" data-shape="${key}">${shapeIcon(key)}${shape.label}</button>`
      )).join("");
      document.querySelectorAll("[data-shape]").forEach(btn => {
        btn.addEventListener("click", () => {
          const oldShape = state.shape;
          const oldValues = currentFieldValues();
          state.shape = btn.dataset.shape;
          const values = mapShapeValues(oldShape, state.shape, oldValues);
          renderShapeGrid();
          renderDimFields(values);
          calculate();
        });
      });
      setResult("shapeShow", shapes[state.shape].label);
      if ($("heroShapeIcon")) $("heroShapeIcon").innerHTML = shapeIcons[state.shape] || "";
      $("dimTitle").textContent = `${shapes[state.shape].label}尺寸`;
    }

    function renderDimFields(values = {}) {
      $("dimFields").innerHTML = shapes[state.shape].fields.map(([id, label]) => (
        `<label>${label}<input id="${id}" inputmode="decimal" autocomplete="off" value="${values[id] ?? $(id)?.value ?? ""}"></label>`
      )).join("");
      shapes[state.shape].fields.forEach(([id]) => $(id).addEventListener("input", calculate));
    }

    function currentFieldValues() {
      const values = {};
      shapes[state.shape].fields.forEach(([id]) => {
        values[id] = $(id)?.value || "";
      });
      return values;
    }

    function mapShapeValues(fromShape, toShape, values) {
      const next = {};
      if (toShape === fromShape) return values;

      const length = values.length || "";
      if (length) next.length = length;

      if (fromShape === "round" && toShape === "tube") {
        next.outer = values.diameter || "";
      }
      if (fromShape === "tube" && toShape === "round") {
        next.diameter = values.outer || "";
      }
      if ((fromShape === "round" || fromShape === "tube") && toShape === "hex") {
        next.across = values.diameter || values.outer || "";
      }
      if (fromShape === "hex" && toShape === "round") {
        next.diameter = values.across || "";
      }
      if (fromShape === "plate" && toShape === "squareTube") {
        next.width = values.width || "";
        next.height = values.height || "";
      }
      if (fromShape === "squareTube" && toShape === "plate") {
        next.width = values.width || "";
        next.height = values.height || "";
      }
      return next;
    }

    function currentMaterialName() {
      const typed = $("material").value.trim();
      const known = findMaterial(typed);
      return known ? known.name : typed;
    }

    function setMaterial(name, fillInput = true) {
      const material = findMaterial(name);
      if (material) {
        if (fillInput) $("material").value = material.name;
        $("density").value = material.density || "";
        const saved = savedPriceForMaterial(material);
        if (saved?.price) {
          $("price").value = saved.price;
        } else if (lastMaterialName && lastMaterialName !== material.name) {
          $("price").value = "";
        }
      }
      lastMaterialName = currentMaterialName();
    }

    function saveMaterialPriceNow() {
      const material = findMaterial($("material").value);
      const name = material ? material.name : currentMaterialName();
      const density = numberOf($("density").value) || material?.density || 0;
      const price = numberOf($("price").value);
      if (!name || !density || !price) return false;
      const saved = getSavedPrices();
      saved[name] = { density, price, manual: true, updatedAt: Date.now() };
      setSavedPrices(saved);
      return true;
    }

    function volumeMm3() {
      const add = numberOf($("allowance").value);
      const raw = (id) => Math.max(0, numberOf($(id)?.value));
      const v = (id) => Math.max(0, raw(id) + add);
      if (state.shape === "round") return Math.PI * Math.pow(v("diameter"), 2) / 4 * v("length");
      if (state.shape === "tube") {
        const outer = v("outer");
        const inner = raw("inner");
        if (inner >= outer) return 0;
        return Math.PI * (Math.pow(outer, 2) - Math.pow(inner, 2)) / 4 * v("length");
      }
      if (state.shape === "plate") return v("length") * v("width") * v("height");
      if (state.shape === "squareTube") {
        const width = v("width");
        const height = v("height");
        const wall = raw("wall");
        const innerWidth = Math.max(0, width - wall * 2);
        const innerHeight = Math.max(0, height - wall * 2);
        return (width * height - innerWidth * innerHeight) * v("length");
      }
      if (state.shape === "hex") return Math.sqrt(3) / 2 * Math.pow(v("across"), 2) * v("length");
      if (state.shape === "ibeam") {
        const height = v("height");
        const flange = v("flange");
        const web = raw("web");
        const flangeThickness = raw("flangeThickness");
        const webHeight = Math.max(0, height - flangeThickness * 2);
        return (flange * flangeThickness * 2 + webHeight * web) * v("length");
      }
      return 0;
    }

    function calculate() {
      const material = findMaterial($("material").value);
      if (material && !numberOf($("density").value)) $("density").value = material.density || "";
      const saved = material ? savedPriceForMaterial(material) : savedPriceForName(currentMaterialName());
      if (!numberOf($("price").value) && saved?.price) $("price").value = saved.price;

      const density = numberOf($("density").value);
      const price = numberOf($("price").value);
      const qty = numberOf($("qty").value) || 1;
      const loss = numberOf($("loss").value);
      const volMm3 = Math.max(0, volumeMm3());
      const volCm3 = volMm3 / 1000;
      const oneKg = volCm3 * density / 1000;
      const totalKg = oneKg * qty * (1 + loss / 100);
      const cost = totalKg * price;

      setResult("cost", money(cost));
      setResult("priceShow", price ? fixed(price, 2) : "0");
      setResult("oneWeight", fixed(oneKg, 4));
      setResult("totalWeight", fixed(totalKg, 4));
      setResult("volume", fixed(volCm3, 2));
      setResult("densityShow", density ? fixed(density, 3) : "0");
      setResult("shapeShow", shapes[state.shape].label);
      setResult("materialShow", currentMaterialName() || "未选择");

      saveMaterialPriceNow();

      const missing = [];
      if (!density) missing.push("密度");
      if (!price) missing.push("单价");
      shapes[state.shape].fields.forEach(([id, label]) => {
        if (!numberOf($(id)?.value)) missing.push(label.replace(" mm", ""));
      });
      $("log").textContent = missing.length ? `还缺：${missing.join("、")}` : "";
    }

    function clearForm() {
      ["material", "density", "price"].forEach(id => $(id).value = "");
      $("qty").value = 1;
      $("loss").value = 0;
      $("allowance").value = 0;
      lastMaterialName = "";
      state.shape = "round";
      renderShapeGrid();
      renderDimFields({});
      renderMaterialChips();
      calculate();
    }

    function bindEvents() {
      $("calcBtn").addEventListener("click", calculate);
      $("clearBtn").addEventListener("click", clearForm);
      ["material", "density", "price", "qty", "loss", "allowance"].forEach(id => {
        $(id).addEventListener("input", () => {
          if (id === "material") setMaterial($(id).value, false);
          renderMaterialChips();
          calculate();
        });
      });
    }

    renderMaterialList();
    renderMaterialChips();
    renderShapeGrid();
    renderDimFields();
    bindEvents();
    calculate();
  </script>
  <script>
    // 广告位微信号一键复制：优先剪贴板接口，老浏览器/微信内置浏览器回退 execCommand
    (function () {
      const btn = document.getElementById("adCopy");
      if (!btn) return;
      const wechat = "xtxb0263";
      const label = btn.textContent;

      function legacyCopy(text) {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0.01;";
        document.body.appendChild(area);
        let ok = false;
        try {
          area.focus({ preventScroll: true });
          area.select();
          area.setSelectionRange(0, area.value.length);
          ok = document.execCommand("copy");
        } catch (error) { ok = false; }
        document.body.removeChild(area);
        return ok;
      }

      function copy(text) {
        if (!(navigator.clipboard && window.isSecureContext)) {
          return Promise.resolve(legacyCopy(text));
        }
        // 个别环境（本地 file:// 打开时）writeText 既不 resolve 也不 reject，加超时兜底，保证按钮一定有反馈
        let settled = false;
        return new Promise((resolve) => {
          const finish = (ok) => { if (!settled) { settled = true; resolve(ok); } };
          navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => finish(legacyCopy(text)));
          setTimeout(() => finish(legacyCopy(text)), 900);
        });
      }

      btn.addEventListener("click", () => {
        copy(wechat).then((ok) => {
          btn.textContent = ok ? "已复制" : wechat;
          setTimeout(() => { btn.textContent = label; }, 1600);
        });
      });
    })();
  </script>
